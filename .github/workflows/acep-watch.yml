name: Watch for new ACEP clinical policies

on:
  schedule:
    - cron: '23 13 * * 1'   # Mondays 13:23 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check ACEP and Annals for new policies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scraper/acep-watch.mjs
